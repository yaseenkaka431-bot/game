<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>City Drive 3D</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

    <div id="game"></div>

    <!-- HUD -->
    <div id="hud">

        <div class="top-left">
            <div class="title">CITY DRIVE</div>

            <div>❤️ Health:
                <span id="health">100</span>
            </div>

            <div>💰 Money:
                $<span id="money">500</span>
            </div>

            <div>⭐ Wanted:
                <span id="wanted">☆☆☆☆☆</span>
            </div>
        </div>

        <div class="mission">
            <b>MISSION</b>
            <br>
            Reach the yellow checkpoint
            <br>
            <span id="missionStatus">0 / 1</span>
        </div>

        <div class="speed">
            🚗 <span id="speed">0</span> KM/H
        </div>

    </div>

    <!-- Mission message -->
    <div id="message">
        Drive to the yellow checkpoint!
    </div>

    <!-- Mobile controls -->
    <div id="mobileControls">

        <button id="forward">▲</button>

        <div class="middleControls">
            <button id="left">◀</button>
            <button id="brake">▼</button>
            <button id="right">▶</button>
        </div>

    </div>

    <!-- Start screen -->
    <div id="startScreen">

        <h1>CITY DRIVE 3D</h1>

        <p>Open World Driving Prototype</p>

        <button id="startButton">START GAME</button>

        <div class="instructions">
            <p>W A S D — Drive</p>
            <p>Mouse — Camera</p>
            <p>Space — Brake</p>
        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
